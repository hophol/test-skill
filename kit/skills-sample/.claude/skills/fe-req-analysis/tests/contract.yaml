# fe-req-analysis 契约 —— 链路生产者:REQ 编号的唯一发放方
process:
  steps: 5                        # 漂移哨兵:必须等于 SKILL.md「流程」编号条数
  must_use:                       # 硬断言:缺失 = C2 FAIL
    - { tool: Read,  args: { file_path: '(?i)prd|需求|用户故事|原型' } }  # 步骤1: 读原始输入
    - { tool: Write, args: { file_path: 'fe-req-[^/\\]+\.md$' } }         # 步骤5: 产物文件名(转录中是绝对路径,锚尾不锚头)
  ordered: [[Read, Write]]        # 先读后写
  forbidden: [Edit, Bash]         # 边界: 只整理不修改、不执行
output:
  artifact: "fe-req-*.md"
  required_sections: [页面清单, 组件区块, 交互说明, 边界条件, 开放问题]
trace:
  emits: 'REQ-\d+'                # 下游(fe-dev/fe-test)凭此编号引用,编号规范在此定死
invariants:
  - { id: req-items-numbered, check: every_item_numbered, id_pattern: 'REQ-\d+' }
    # 交互说明与边界条件逐条编号(SKILL.md 步骤5 承诺)
metamorphic:
  - id: add-page-grows-reqs
    transform: 输入材料 +1 个页面
    expect: 页面清单 +1,且新增页面产生的条目均有新的 REQ 编号(旧编号不变)
