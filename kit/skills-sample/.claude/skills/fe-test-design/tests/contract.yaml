# fe-test-design 契约 —— 链路终点消费者,追溯覆盖的验收方
process:
  steps: 5
  must_use:
    - { tool: Read,  args: { file_path: '(?i)fe-req|fe-dev|需求|方案' } }  # 步骤1: 读上游产物
    - { tool: Write, args: { file_path: 'fe-test-[^/\\]+\.md$' } }         # 步骤5: 产物文件名(转录中是绝对路径,锚尾不锚头)
  ordered: [[Read, Write]]
  forbidden: [Edit, Bash]          # 边界: 不改上游、不写测试代码
output:
  artifact: "fe-test-*.md"
  required_sections: [单元, 组件, E2E, 验收核对表]
trace:
  consumes: ["fe-req-*.md"]
  rules: [every_upstream_id_covered_ge_1, no_phantom_ids]
invariants:
  - { id: case-has-req, check: every_case_references_id, id_pattern: 'REQ-\d+' }
    # 每条用例必须挂 REQ 编号(SKILL.md 步骤5 承诺)
metamorphic:
  - id: add-req-grows-cases
    transform: 上游需求说明 +1 条带新 REQ 编号的条目
    expect: 新 REQ 被至少一条用例覆盖,且总用例数不减
