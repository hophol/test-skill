# 异常 skill 验证集 —— v2 套件的"已知答案"回归集
# 用途: 套件任何组件改动后跑一遍静态集(零成本),动态集按需(花会话),检测能力不得退化
# verdict 语义: caught(预期层报出) / caught-elsewhere(别的层报出,备注) / missed(漏抓,须定性)

static:                       # 零会话,run_validation 默认全跑
  - { id: A01, class: 结构,     dir: A01-no-description,            expect_tool: lint_skill,    expect_signal: "description" }
  - { id: A02, class: 结构,     dir: A02-name-mismatch,             expect_tool: lint_skill,    expect_signal: "目录名" }
  - { id: A03, class: 结构,     dir: A03-dangling-reference,        expect_tool: contract_lint, expect_signal: "引用的文件不存在" }
  - { id: A04, class: 契约矛盾, dir: A04-steps-drift,               expect_tool: contract_lint, expect_signal: "漂移" }
  - { id: A05, class: 契约矛盾, dir: A05-forbidden-contradiction,   expect_tool: contract_lint, expect_signal: "矛盾" }
  - { id: A06, class: 链路断点, dir: A06-unpromised-emits,          expect_tool: contract_lint, expect_signal: "emits" }
  - { id: A07, class: 安全,     dir: A07-exfil-curl,                expect_tool: security_lint, expect_signal: "数据外传" }
  - { id: A08, class: 安全,     dir: A08-destructive-creds,         expect_tool: security_lint, expect_signal: "凭证读取" }
  - { id: A09, class: 安全,     dir: A09-env-dump,                  expect_tool: security_lint, expect_signal: "凭证外传" }
  - { id: W1, class: 结构-野生, dir: W1-wild-dangling-scripts,      expect_tool: contract_lint, expect_signal: "引用的文件不存在" }   # 真实样本:Trail of Bits supply-chain-risk-auditor 引用未发布的 collect.py/render.py
  - { id: W2, class: 结构-野生, dir: W2-wild-dangling-references,  expect_tool: contract_lint, expect_signal: "引用的文件不存在" }   # 真实样本:ui-ux-pro-max 引用不存在的 references/quick-reference.md 等;另缺 reasoning_contract 模块(双重发布缺陷)

dynamic:                      # 花会话,run_validation --dynamic 委托 run_mutants --only
  # 预期能抓
  - { id: D1, class: 行为-C2,  mutant: M11-bash-init-step,   expect: "C2.forbidden(Bash 教唆,013 实证同类)" }
  - { id: D2, class: 行为-C3,  mutant: M5-free-sections,     expect: "C3.sections(章节承诺删除)" }
  # 已知盲区(定性在案,留作灵敏度下界)
  - { id: D3, class: 行为-C2,  mutant: M7-reverse-order,     expect: "C2.ordered —— 已知可漏抓(模型自救)" }
  - { id: D4, class: 行为-C3,  mutant: M3-req-optional,      expect: "C3.invariant —— 已知可漏抓(指令弱化 vs 强习惯)" }
  - { id: D5, class: L1触发,   mutant: M8-break-description, expect: "L1 —— 已知漏抓(单skill探针过强,需干扰池)" }
