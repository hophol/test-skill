# fe-dev-design 契约 —— 链路中间消费者
process:
  steps: 4
  must_use:
    - { tool: Read,  args: { file_path: '(?i)fe-req|需求' } }      # 步骤1: 读上游需求说明
    - { tool: Write, args: { file_path: 'fe-dev-[^/\\]+\.md$' } }  # 步骤6: 产物文件名(转录中是绝对路径,锚尾不锚头)
  should_use:                      # 软断言:缺失 = WARN(条件步骤,工作区有 package.json 才要求)
    - { tool: Read,  args: { file_path: 'package\.json' } }        # 步骤3: 先读技术栈再选型
  ordered: [[Read, Write]]
  forbidden: [Edit, Bash]          # 边界: 不重写需求、不执行
output:
  artifact: "fe-dev-*.md"
  required_sections: [组件树, 状态设计, API对接, 路由与目录, 风险点]
trace:
  consumes: ["fe-req-*.md"]
  rules: [no_phantom_ids]
  # 注: SKILL.md 未要求 dev 产物挂 REQ 编号 —— 已知链路缺口,P3 实测预期追溯覆盖率 0%,
  # 拿数据后决定是给 SKILL.md 补承诺,还是维持现状(不影响 req->test 的覆盖断言)
invariants: []
metamorphic: []
