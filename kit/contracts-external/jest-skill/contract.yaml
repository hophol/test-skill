# jest-skill(外部 TestMu AI)入池契约 —— React 组件测试生成
process:
  must_use:
    - { tool: Read,  args: { file_path: 'Button' } }              # 读被测组件
    - { tool: Write, args: { file_path: '\.test\.jsx$' } }        # RTL 测试
  ordered: [[Read, Write]]
  forbidden: [Bash]
output:
  naming: task
  artifacts: ["*.test.jsx"]
  contains:
    - '@testing-library/react'
    - 'render\('
    - 'fireEvent|userEvent'
    - 'expect\('
invariants: []
metamorphic: []
