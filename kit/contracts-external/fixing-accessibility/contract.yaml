# fixing-accessibility(外部 ibelick)入池契约 —— 规则表几乎全可确定性断言
process:
  must_use:
    - { tool: Read,  args: { file_path: 'checkout|a11y' } }        # 读被审文件
    - { tool: Write, args: { file_path: 'fixed-[^/\\]+\.html$' } } # 修复产物
    - { tool: Write, args: { file_path: 'a11y-[^/\\]+\.md$' } }    # 违规报告(SKILL 承诺:引用原文+修法)
  ordered: [[Read, Write]]
  forbidden: [Bash]
output:
  naming: task
  artifacts: ["fixed-*.html", "a11y-*.md"]
  contains:                     # 对应 SKILL 规则 1/2/5/8 的修复特征(fixture 专设的靶点)
    - 'aria-label'              # 图标按钮补名
    - '<button'                 # div-as-button -> 原生元素(规则2:prefer native)
    - 'aria-describedby|aria-invalid'  # 表单错误关联(规则5)
    - 'alt='                    # 图片补 alt(规则8)
invariants: []
metamorphic: []
