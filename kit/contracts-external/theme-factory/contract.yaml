# theme-factory(外部 anthropics/skills)入池契约
# 注意:该 skill 原流程是交互式(展示 showcase -> 问用户 -> 等确认),无头任务必须预选主题绕过
process:
  must_use:
    - { tool: Read,  args: { file_path: 'themes[/\\]' } }              # 应用流程第1步:必读主题定义文件
    - { tool: Read,  args: { file_path: 'product-copy|copy' } }        # 读素材
    - { tool: Write, args: { file_path: 'themed-[^/\\]+\.html$' } }
  ordered: [[Read, Write]]
  forbidden: [Bash]
output:
  naming: task
  artifacts: ["themed-*.html"]
  contains:                     # Arctic Frost 色板 4 色全应用(任务固定该主题,色值来自 themes/arctic-frost.md)
    - '#d4e4f7|rgb\(212,\s*228,\s*247\)'
    - '#4a6fa5|rgb\(74,\s*111,\s*165\)'
    - '#c0c0c0|rgb\(192,\s*192,\s*192\)'
    - '#fafafa|rgb\(250,\s*250,\s*250\)'
    - 'DejaVu Sans'
invariants: []
metamorphic: []
