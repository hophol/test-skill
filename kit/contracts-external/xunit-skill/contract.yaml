# xunit-skill(外部 LambdaTest/agent-skills@main)入池契约 —— 批量入池:静态已验(lint+security),golden 任务排队中
process:
  must_use:
    - { tool: Write, args: { file_path: '\.cs$' } }
  forbidden: [Bash]
output:
  naming: task
  artifacts: ["*Test.cs"]
  contains:
    - '\[Fact\]|\[Theory\]'
    - 'Assert\.'
    - 'using Xunit'
invariants: []
metamorphic: []
