# skill-creator(外部 anthropics/skills@main)入池契约 —— 批量入池:静态已验(lint+security),golden 任务排队中
lint_waivers:   # 已知缺陷(野生悬空第四例,Anthropic 官方也没逃过):SKILL.md 引用的 schemas.md 未发布
  - "引用的文件不存在: references/schemas.md"
process:
  must_use:
    - { tool: Write, args: { file_path: 'SKILL\.md$' } }
  forbidden: [Bash]
output:
  naming: task
  artifacts: ["*/SKILL.md"]
  contains:
    - '---'
    - 'name:'
    - 'description:'
invariants: []
metamorphic: []
