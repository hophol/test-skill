# brand-guidelines(外部 anthropics/skills)入池契约 —— 命名由任务指定,非 SKILL.md 承诺
process:
  # 外部 skill 无「流程」章节,steps 哨兵跳过(lint 会提示)
  must_use:
    - { tool: Read,  args: { file_path: 'landing' } }                  # 读被排版的素材
    - { tool: Write, args: { file_path: 'styled-[^/\\]+\.html$' } }   # 任务指定的产物名
  ordered: [[Read, Write]]
  forbidden: [Bash]
output:
  naming: task
  artifacts: ["styled-*.html"]
  contains:                     # 品牌确定性断言:主色/背景/主强调色 + 双字体族(hex 与 rgb 两种写法都认)
    - '#141413|rgb\(20,\s*20,\s*19\)'
    - '#faf9f5|rgb\(250,\s*249,\s*245\)'
    - '#d97757|rgb\(217,\s*119,\s*87\)'
    - 'Poppins|Arial'
    - 'Lora|Georgia'
invariants: []
metamorphic: []
