# slack-gif-creator(外部 anthropics/skills@main)入池契约 —— 批量入池:静态已验(lint+security),golden 任务排队中
process:
  must_use:
    - { tool: Write, args: { file_path: '\.py$' } }
  forbidden: [Bash]
output:
  naming: task
  artifacts: ["gif_*.py"]
  contains:
    - 'from PIL|import imageio|import numpy'
    - 'def |class '
invariants: []
metamorphic: []
