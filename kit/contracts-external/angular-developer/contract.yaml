# angular-developer(外部 Angular 团队)入池契约
lint_waivers:            # 已知缺陷(2026-09-01 审计发现,野生悬空第三例):SKILL.md 引用的 4 个文件仓库未发布,主体 36/40 引用可用
  - "引用的文件不存在: references/pipes.md"
  - "引用的文件不存在: references/naming-conventions.md"
  - "引用的文件不存在: references/http-client.md"
  - "引用的文件不存在: references/environment-configuration.md"
process:
  must_use:
    - { tool: Write, args: { file_path: '\.ts$' } }        # 组件产物
  should_use:                     # 软断言:SKILL 鼓励但无头环境不一定走
    - { tool: Read,  args: { file_path: 'references[/\\]' } }   # 咨询 reference 文档
    - { tool: Bash,  args: { command: 'ng build|npx' } }   # SKILL 第3条:生成后 ng build 自检(无头会被拒)
  forbidden: []
output:
  naming: task
  artifacts: ["*.ts"]
  contains:
    - '@Component'                # Angular 组件装饰器
    - 'signal\(|signals|linkedSignal|input\('   # SKILL 主推的响应式原语
    - 'template:|templateUrl'
invariants: []
metamorphic: []
